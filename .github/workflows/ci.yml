# Lightweight static/build CI on main/PR — release publishing is handled separately.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        run: go vet ./...
      - name: Build with provenance
        shell: bash
        run: |
          BUILD_COMMIT="$(git rev-parse HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 go build -ldflags "-X main.commit=${BUILD_COMMIT} -X main.date=${BUILD_DATE}" -o bin/mcpx ./cmd/mcpx-server
          VERSION_OUTPUT="$(./bin/mcpx -version)"
          [[ "${VERSION_OUTPUT}" == *"commit=${BUILD_COMMIT}"* ]]
          [[ "${VERSION_OUTPUT}" != *"date=unknown"* ]]
